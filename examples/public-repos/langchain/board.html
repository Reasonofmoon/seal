<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SEAL Gap Board</title>
<style>
:root {
  --bg: #0b0f14;
  --panel: #121821;
  --line: #243041;
  --text: #e7eef8;
  --muted: #8b9bb0;
  --accent: #38bdf8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(1200px 600px at 10% -10%, #132033 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 1.25rem 1.5rem 0.75rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: flex-end;
  justify-content: space-between;
}
h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
.sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; max-width: 52rem; }
.pillrow { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.pill {
  font-size: 0.75rem;
  padding: 0.25rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
}
.pill strong { color: var(--text); font-weight: 600; }
main { padding: 1.25rem 1.5rem 3rem; display: grid; gap: 1.25rem; }
section h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 0.75rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.75rem;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.card.recommended {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(56,189,248,0.25);
}
.card.sealed { opacity: 0.85; }
.badge {
  display: inline-flex;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.15rem 0.45rem;
  border-radius: 6px;
}
.badge.open { background: rgba(59,130,246,0.15); color: #93c5fd; }
.badge.blocked { background: rgba(245,158,11,0.15); color: #fcd34d; }
.badge.sealed { background: rgba(34,197,94,0.15); color: #86efac; }
.badge.locked { background: rgba(100,116,139,0.2); color: #cbd5e1; }
.badge.ready { background: rgba(167,139,250,0.18); color: #ddd6fe; }
.badge.done { background: rgba(34,197,94,0.15); color: #86efac; }
.ask { font-size: 0.95rem; line-height: 1.45; }
.meta {
  font-size: 0.75rem;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  word-break: break-all;
}
.risk { font-size: 0.72rem; color: var(--muted); }
.risk.user_trust, .risk.irreversible { color: #fca5a5; }
.rec { font-size: 0.7rem; color: var(--accent); font-weight: 600; }
.effects { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.effect {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 0.65rem 0.8rem;
  min-width: 180px;
}
.banner {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  color: var(--muted);
  font-size: 0.85rem;
  background: rgba(18,24,33,0.6);
}
.banner em { color: var(--text); font-style: normal; }
details {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  padding: 0.5rem 0.75rem;
}
details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
pre {
  overflow: auto;
  max-height: 320px;
  font-size: 0.72rem;
  color: #cbd5e1;
  background: #0a0e13;
  padding: 0.75rem;
  border-radius: 8px;
}
footer { color: var(--muted); font-size: 0.75rem; padding: 0 1.5rem 2rem; }
.cta-bar {
  position: sticky; bottom: 0; display: flex; gap: 0.75rem; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
  padding: 0.85rem 1.25rem; margin: 0 1.5rem 1rem;
  background: rgba(18,24,33,0.95); border: 1px solid var(--accent);
  border-radius: 12px; backdrop-filter: blur(8px);
}
.cta-bar strong { color: var(--accent); }
.cta-bar code { font-size: 0.75rem; color: #cbd5e1; }

</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">SEAL Gap Board</h1>
    <div class="sub" id="idea"></div>
  </div>
  <div class="pillrow" id="pills"></div>
</header>
<main>
  <div class="banner" id="banner"></div>
  <section>
    <h2>Next (Vein × open)</h2>
    <div class="grid" id="next"></div>
  </section>
  <section>
    <h2>Gaps</h2>
    <div class="grid" id="gaps"></div>
  </section>
  <section>
    <h2>Coverage ledger (beyond accuracy-only)</h2>
    <div class="pillrow" id="coverage"></div>
    <div class="sub" id="escalate" style="margin-top:0.5rem"></div>
  </section>
  <section>
    <h2>Effects (post-seal only)</h2>
    <div class="effects" id="effects"></div>
  </section>
  <section>
    <details>
      <summary>Vein edges · UKDL subset dump</summary>
      <pre id="vein"></pre>
      <pre id="ukdl"></pre>
    </details>
  </section>
</main>
<div class="cta-bar" id="cta">
  <div><strong>Next action</strong> — seal the highlighted gap, then refresh coverage.</div>
  <code id="cta-cmd">seal status --graph …</code>
</div>
<footer id="foot"></footer>

}
const nextIds = new Set((BOARD.next || []).map(n => n.gap));
const nextCards = BOARD.gaps.filter(g => nextIds.has(g.id) && g.status === 'open');
document.getElementById('next').innerHTML = nextCards.length
  ? nextCards.map(g => cardHTML(g, true)).join('')
  : '<div class="sub">No open unblocked gaps — foundation may be sealed.</div>';
document.getElementById('gaps').innerHTML = BOARD.gaps.map(g => cardHTML(g)).join('');
const cov = BOARD.coverage || {};
const cc = cov.counts || {};
document.getElementById('coverage').innerHTML = [
  ['auto', cc.auto||0], ['code', cc.code||0], ['human', cc.human||0],
  ['escalate', cc.escalate||0], ['auto_rate', (cov.auto_rate!=null?cov.auto_rate.toFixed(2):'—')]
].map(([k,v]) => '<span class="pill">'+k+' <strong>'+v+'</strong></span>').join('');
const esc = cov.escalate_open || [];
document.getElementById('escalate').textContent = esc.length
  ? ('Open escalations: ' + esc.join(', '))
  : 'No open escalations.';

document.getElementById('effects').innerHTML = (BOARD.effects || []).map(e =>
  '<div class="effect"><span class="badge ' + esc(e.status) + '">' + esc(e.status) + '</span>' +
  '<div class="meta" style="margin-top:0.4rem">' + esc(e.id) + '</div>' +
  '<div class="risk">' + esc(e.run || '') + '</div></div>'
).join('') || '<div class="sub">No effects in this pack.</div>';
document.getElementById('vein').textContent = JSON.stringify(BOARD.vein, null, 2);
document.getElementById('ukdl').textContent = UKDL || '(ukdl not embedded)';
const nxt = (BOARD.next && BOARD.next[0]) ? BOARD.next[0].gap : '(none open)';
document.getElementById('cta-cmd').textContent =
  'seal strike|seal-code — next: ' + nxt;
document.getElementById('foot').textContent =
  'seal ' + (BOARD.seal_version || '') + ' · Gap Board S8 · JSON canonical remains source of truth';
</script>
</body>
</html>
