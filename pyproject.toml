[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seal-graph"
version = "0.3.1"
description = "SEAL — No seal, no advance. Product truth as a sealed graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reason of Moon" }]
keywords = ["seal", "workflow", "product", "judgment", "gap", "graph", "typesafe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Reasonofmoon/seal"
Documentation = "https://github.com/Reasonofmoon/seal/tree/main/docs"
Manifesto = "https://github.com/Reasonofmoon/seal/blob/main/docs/SEAL-FRAMEWORK.md"
Why = "https://github.com/Reasonofmoon/seal/blob/main/docs/WHY-SEAL.md"

[project.scripts]
seal = "seal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seal = ["static/*"]
